            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            left: 0;
            right: 0;

            height: 4px;

            height: 100%;

            transition: width 0.5s ease;
        }
        
        .analysis-panel {
            position: sticky;
            top: 20px;
        }

            opacity: 0;
